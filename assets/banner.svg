<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pulseLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.15); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 1400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveFloat {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes metricPulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    .orb-1 {
      animation: pulseOrb 8s ease-in-out infinite alternate;
      transform-origin: 200px 150px;
    }
    .orb-2 {
      animation: pulseOrb 10s ease-in-out infinite alternate 2s;
      transform-origin: 1000px 250px;
    }
    .animated-trace {
      stroke-dasharray: 80, 20;
      animation: dashCycle 20s linear infinite;
    }
    .floating-card {
      animation: waveFloat 6s ease-in-out infinite;
    }
    .metric-text {
      animation: metricPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Background Orbs (Behind everything) -->
  <circle class="orb-1" cx="220" cy="140" r="180" fill="#38bdf8" opacity="0.2" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="240" r="220" fill="#a855f7" opacity="0.2" filter="url(#glow)" />

  <!-- Dynamic Load Test Simulation Curves (Background telemetry graph) -->
  <g opacity="0.35">
    <!-- Area under curve -->
    <path d="M 0 380 Q 200 360 350 280 T 600 240 T 850 160 T 1050 200 T 1200 140 L 1200 420 L 0 420 Z" fill="url(#glowArea)" />
    <!-- Dynamic metric lines -->
    <path d="M 0 380 Q 200 360 350 280 T 600 240 T 850 160 T 1050 200 T 1200 140" fill="none" stroke="url(#pulseLineGrad)" stroke-width="2.5" class="animated-trace" />
    <path d="M 0 400 Q 250 370 450 320 T 750 300 T 950 220 T 1200 210" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="8, 6" opacity="0.7" />
  </g>

  <!-- Foreground Content Container -->
  <!-- Top Badge / Category Pill -->
  <g transform="translate(600, 75)">
    <rect x="-180" y="-18" width="360" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="-150" cy="0" r="5" fill="#34d399" filter="url(#glowSubtle)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5" text-anchor="middle">
      HIGH-SCALE BENCHMARKING &amp; APM
    </text>
  </g>

  <!-- Main Title (Strictly Foreground, Non-Obscured) -->
  <text x="600" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="-1">
    <tspan fill="url(#primaryGrad)">Awesome API Load &amp; Performance Testing</tspan>
  </text>

  <!-- Subtitle & Value Proposition -->
  <text x="600" y="200" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="17" letter-spacing="0.2">
    Curated architectures, load generators, stress testing tools &amp; SaaS platforms for modern APIs
  </text>

  <!-- Interactive Telemetry Feature Pills (Foreground Cards) -->
  <g transform="translate(180, 250)">
    <!-- Card 1: Virtual Users -->
    <g transform="translate(0, 0)" class="floating-card">
      <rect width="180" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="28" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">MAX CONCURRENCY</text>
      <text x="20" y="55" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" class="metric-text">1,000,000+ VU</text>
    </g>

    <!-- Card 2: Throughput RPS -->
    <g transform="translate(220, 0)" class="floating-card" style="animation-delay: 1.5s;">
      <rect width="180" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="28" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">THROUGHPUT RATE</text>
      <text x="20" y="55" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" class="metric-text">500k+ QPS</text>
    </g>

    <!-- Card 3: Protocols Supported -->
    <g transform="translate(440, 0)" class="floating-card" style="animation-delay: 3s;">
      <rect width="180" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="28" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">PROTOCOL SUITE</text>
      <text x="20" y="55" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="700">HTTP/2 • gRPC • WS</text>
    </g>

    <!-- Card 4: CI/CD Automation -->
    <g transform="translate(660, 0)" class="floating-card" style="animation-delay: 4.5s;">
      <rect width="180" height="74" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
      <text x="20" y="28" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">SHIFT-LEFT PIPELINE</text>
      <text x="20" y="55" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="700">100% CI/CD Ready</text>
    </g>
  </g>

  <!-- Bottom Accent Status Bar -->
  <g transform="translate(0, 395)">
    <line x1="100" y1="0" x2="1100" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="600" y="16" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle" font-weight="500">
      ⚡ Open Source Load Generators • Managed Cloud Platforms • Enterprise APM Benchmarks • Real-Time Metrics
    </text>
  </g>
</svg>
